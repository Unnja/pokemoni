name: Pokemon Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run tracking script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat << 'EOF' > tracker.py
          import os, re, json, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          webhook_url = os.environ.get('DISCORD_WEBHOOK')

          urls_to_check = [
              ('Veselý drak', 'https://www.vesely-drak.cz/produkty/specialni-sety/'),
              ('Veselý drak', 'https://www.vesely-drak.cz/produkty/pokemon-elite-trainer-box/'),
              ('Alza', 'https://www.alza.cz/hracky/pokemon-booster-boxy-a-specialni-boxy/18903046.htm'),
              ('Alza', 'https://www.alza.cz/hracky/pokemon-premiove-kolekce/18903054.htm'),
              ('Planetaher', 'https://www.planetaher.cz/pokemon/?order=-date'),
              ('Xzone', 'https://www.xzone.cz/sberatelske-hry-pokemon-tcg?sort=date_desc&s=60&page=1&term=&c=725'),
              ('Smarty', 'https://www.smarty.cz/pokemon-tcg-4c14578'),
              ('Modroocko', 'https://www.modroocko.cz/nedrevene-hracky/spolecenske-hry/pokemon-tcg/'),
              ('Ceskatrafika', 'https://www.ceskatrafika.com/pokemon-sberatelske-karty/?order=bestseller'),
              ('Najada', 'https://www.najada.games/pokemon'),
              ('Pompo', 'https://pompo.cz/pokemon-tcg/'),
              ('Kraken', 'https://krakencards.eu/cs/products?category=pokemon')
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept-Language': 'cs-CZ,cs;q=0.9'
          }

          cache_file = 'cache.json'
          known_products = {}
          if os.path.exists(cache_file):
              try:
                  with open(cache_file, 'r', encoding='utf-8') as f:
                      known_products = json.load(f)
              except:
                  known_products = {}

          # Jednorázový reset, pokud v cache zůstal balast (např. košík nebo doprava)
          if any('Doprava' in k or 'košík' in k or 'Xzone_Skladem' in k for k in known_products.keys()):
              known_products = {}

          def detect_stock(text):
              t = text.lower()
              out_keywords = ['vyprodáno', 'není skladem', 'nedostupné', 'na dotaz', 'momentálně nedostupné', 'hlídat dostupnost', 'sold out', 'připravujeme']
              in_keywords = ['skladem', 'ihned k odeslání', 'předobjednávka', 'koupit', 'do košíku', 'vložit do košíku']
              
              for kw in out_keywords:
                  if kw in t:
                      if 'připravujeme' in t:
                          return False, '⏳ Připravujeme (zatím nelze koupit)'
                      return False, '❌ Vyprodáno / Nedostupné'
              for kw in in_keywords:
                  if kw in t:
                      if 'předobjednávka' in t:
                          return True, '⏳ Předobjednávka'
                      return True, '✅ Skladem'
              return True, 'ℹ️ Pravděpodobně skladem'

          def extract_price(text):
              # Najde všechny ceny ve formátu "1 299 Kč" nebo "349,-" a vezme tu správnou (bez ID před ní)
              matches = re.findall(r'(?<!\d)(\d{1,3}(?:[\s\xa0]\d{3})*|\d{2,5})(?:,-|\s*Kč)', text)
              valid_prices = []
              for m in matches:
                  num = int(re.sub(r'\s+', '', m))
                  if 30 <= num <= 50000: # Ignorujeme 0 Kč (doprava) a 6místná katalogová ID
                      clean_str = f"{num:,}".replace(",", " ")
                      valid_prices.append(f"{clean_str} Kč")
              return valid_prices[-1] if valid_prices else None

          def is_valid_title(title):
              t = title.lower()
              if 'pokemon' not in t and 'pokémon' not in t and 'poké ball' not in t:
                  return False
              bad_words = ['doprava', 'košík', 'skladem', 'připravujeme', 'top 10', 'kategorie']
              if any(bw in t for bw in bad_words):
                  return False
              return True

          notifications = []

          for shop_name, url in urls_to_check:
              try:
                  resp = requests.get(url, headers=headers, timeout=15)
                  if resp.status_code != 200:
                      print(f'Chyba {resp.status_code} u {shop_name}')
                      continue

                  soup = BeautifulSoup(resp.text, 'html.parser')
                  
                  cards = soup.find_all(['div', 'article', 'li'], class_=lambda x: x and any(
                      k in x.lower() for k in ['product', 'item', 'box', 'card', 'browsingitem', 'p-in']
                  ))

                  seen_in_shop = set()

                  for card in cards:
                      if len(card.find_all(['div', 'article', 'li'])) > 25:
                          continue

                      card_text = card.get_text(" ", strip=True)
                      price = extract_price(card_text)
                      if not price:
                          continue

                      # Hledáme název produktu – projdeme všechny nadpisy a odkazy a vybereme ten, co obsahuje "Pokémon"
                      candidates = card.find_all(['h2', 'h3', 'h4', 'a'])
                      title_el = None
                      for el in candidates:
                          txt = el.get_text(" ", strip=True)
                          if is_valid_title(txt) and len(txt) < 130:
                              title_el = el
                              break

                      if not title_el:
                          continue

                      title = title_el.get_text(" ", strip=True)
                      # Odstranění přilepené ceny z názvu (např. u Pompa)
                      title = re.sub(r'\d[\d\s]*Kč.*$', '', title).strip()

                      if len(title) < 8 or title in seen_in_shop:
                          continue
                      seen_in_shop.add(title)

                      link_el = title_el if title_el.name == 'a' and title_el.get('href') else card.find('a', href=True)
                      product_url = urljoin(url, link_el['href']) if link_el else url

                      in_stock, stock_label = detect_stock(card_text)
                      item_id = f"{shop_name}_{title}"

                      prev_data = known_products.get(item_id)

                      if prev_data is None:
                          known_products[item_id] = {'in_stock': in_stock, 'price': price}
                          if in_stock:
                              notifications.append({
                                  'type': '🆕 NOVINKA SKLADEM',
                                  'shop': shop_name,
                                  'title': title,
                                  'price': price,
                                  'stock': stock_label,
                                  'url': product_url,
                                  'color': 3066993
                              })
                      else:
                          was_in_stock = prev_data.get('in_stock', False)
                          if not was_in_stock and in_stock:
                              notifications.append({
                                  'type': '🔄 NASKLADNĚNO (RESTOCK)',
                                  'shop': shop_name,
                                  'title': title,
                                  'price': price,
                                  'stock': stock_label,
                                  'url': product_url,
                                  'color': 15844367
                              })
                          known_products[item_id] = {'in_stock': in_stock, 'price': price}

              except Exception as e:
                  print(f'Chyba u {shop_name}: {e}')

          with open(cache_file, 'w', encoding='utf-8') as f:
              json.dump(known_products, f, ensure_ascii=False, indent=2)

          if notifications and webhook_url:
              for item in notifications[:10]:
                  embed = {
                      "title": f"{item['type']} | {item['shop']}",
                      "description": f"**[{item['title']}]({item['url']})**",
                      "color": item['color'],
                      "fields": [
                          {"name": "💰 Cena", "value": item['price'], "inline": True},
                          {"name": "📦 Dostupnost", "value": item['stock'], "inline": True}
                      ]
                  }
                  requests.post(webhook_url, json={"embeds": [embed]})
              print(f"Odesláno {min(len(notifications), 10)} upozornění na Discord.")
          else:
              print("Žádné nové produkty ani naskladnění.")
          EOF
          python tracker.py
          rm tracker.py

      - name: Commit cache updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update product cache'
          file_pattern: cache.json
