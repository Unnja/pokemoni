name: Pokemon Tracker

on:
  workflow_dispatch:

concurrency:
  group: pokemon-tracker-group
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run tracking script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat << 'EOF' > tracker.py
          import os, re, json, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          webhook_url = os.environ.get('DISCORD_WEBHOOK', '').strip()

          urls_to_check = [
              ('Veselý drak', 'https://www.vesely-drak.cz/produkty/specialni-sety/', False),
              ('Veselý drak', 'https://www.vesely-drak.cz/produkty/pokemon-elite-trainer-box/', False),
              ('Planetaher', 'https://www.planetaher.cz/pokemon/?order=-date', False),
              ('Xzone', 'https://www.xzone.cz/sberatelske-hry-pokemon-tcg?sort=date_desc&s=60&page=1&term=&c=725', False),
              ('Smarty', 'https://www.smarty.cz/pokemon-tcg-4c14578', True),
              ('Modroocko', 'https://www.modroocko.cz/nedrevene-hracky/spolecenske-hry/pokemon-tcg/', False),
              ('Ceskatrafika', 'https://www.ceskatrafika.com/pokemon-sberatelske-karty/?order=bestseller', False),
              ('Najada', 'https://www.najada.games/pokemon/sealed-products', True),
              ('Pompo', 'https://pompo.cz/pokemon-tcg/', True),
              ('Kraken', 'https://krakencards.eu/cs/products?category=pokemon', True)
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept-Language': 'cs-CZ,cs;q=0.9'
          }

          cache_file = 'cache.json'
          known_products = {}
          if os.path.exists(cache_file):
              try:
                  with open(cache_file, 'r', encoding='utf-8') as f:
                      known_products = json.load(f)
              except:
                  known_products = {}

          def is_pokemon_item(title):
              t = title.lower().strip()
              if len(t) <= 12 or t in ['pokémon tcg', 'pokemon tcg']:
                  return False
              if not any(k in t for k in ['pokemon', 'pokémon', 'poké ball', 'poke ball']):
                  return False
              bad_words = [
                  'doprava', 'košík', 'skladem', 'připravujeme', 'top 10', 'kategorie',
                  'filtrovat', 'seřadit', 'přihlášení', 'flesh and blood', 'magic:',
                  'lorcana', 'one piece', 'star wars', 'poškozené obaly'
              ]
              if any(bw in t for bw in bad_words):
                  return False
              return True

          known_products = {
              k: v for k, v in known_products.items()
              if is_pokemon_item(k.split('_', 1)[-1]) and not k.startswith('Planetaher_Pocket portfolio')
          }

          def clean_title_text(raw):
              txt = re.sub(r'^(?:Znáte z katalogu|Cenový hit[^\s]*|Novinka|Akce|-\d+%\s+|\d+\s+(?!Pocket\b))\s*', '', raw, flags=re.I).strip()
              txt = re.sub(r'\s*(?:Dostupné v jiných prodejnách|Nedostupné|Skladem|Vyprodáno).*$', '', txt, flags=re.I).strip()
              txt = re.sub(r'\d[\d\s\xa0]*(?:,-|\s*Kč|\s*€).*$', '', txt).strip()
              return txt

          def parse_price_num(price_str):
              if not price_str:
                  return None
              digits = re.sub(r'[^\d]', '', price_str)
              return int(digits) if digits else None

          def detect_stock(text):
              t = text.lower()
              out_keywords = [
                  'vyprodáno', 'není skladem', 'nedostupné', 'na dotaz',
                  'momentálně nedostupné', 'hlídat dostupnost', 'sold out',
                  'připravujeme', 'nelze zakoupit', 'těšíme se',
                  'dostupné v jiných prodejnách'
              ]
              in_keywords = ['skladem', 'ihned k odeslání', 'předobjednávka', 'koupit', 'do košíku', 'vložit do košíku', 'ks']
              
              for kw in out_keywords:
                  if kw in t:
                      if 'připravujeme' in t or 'těšíme se' in t:
                          return False, '⏳ Připravujeme'
                      if 'v jiných prodejnách' in t:
                          return False, '🏪 Jen na prodejnách'
                      return False, '❌ Vyprodáno'
              for kw in in_keywords:
                  if kw in t:
                      if 'předobjednávka' in t:
                          return True, '⏳ Předobjednávka'
                      return True, '✅ Skladem'
              return True, 'ℹ️ Pravděpodobně skladem'

          def extract_price(text):
              matches = re.findall(r'(?<!\d)(\d{1,3}(?:[\s\xa0]\d{3})*|\d{2,5})(?:,-|\s*Kč|\s*€)', text)
              valid_prices = []
              for m in matches:
                  num = int(re.sub(r'\s+', '', m))
                  if 30 <= num <= 50000:
                      clean_str = f"{num:,}".replace(",", " ")
                      currency = "€" if "€" in text else "Kč"
                      valid_prices.append(f"{clean_str} {currency}")
              return valid_prices[-1] if valid_prices else None

          def evaluate_item(shop_name, title, price, in_stock, stock_label, product_url):
              item_id = f"{shop_name}_{title}"
              prev_data = known_products.get(item_id)

              if prev_data is None:
                  known_products[item_id] = {'in_stock': in_stock, 'price': price}
                  if in_stock:
                      notifications.append({
                          'type': '🆕 NOVINKA SKLADEM',
                          'shop': shop_name,
                          'title': title,
                          'price': price,
                          'stock': stock_label,
                          'url': product_url,
                          'color': 3066993
                      })
              else:
                  was_in_stock = prev_data.get('in_stock', False)
                  old_price_str = prev_data.get('price', '')
                  old_num = parse_price_num(old_price_str)
                  new_num = parse_price_num(price)

                  if not was_in_stock and in_stock:
                      price_info = f"{old_price_str} ➔ {price}" if (old_num and new_num and old_num != new_num) else price
                      notifications.append({
                          'type': '🔄 NASKLADNĚNO (RESTOCK)',
                          'shop': shop_name,
                          'title': title,
                          'price': price_info,
                          'stock': stock_label,
                          'url': product_url,
                          'color': 15844367
                      })
                  elif old_num and new_num and new_num != old_num:
                      if new_num < old_num:
                          notifications.append({
                              'type': '📉 ZLEVNĚNO',
                              'shop': shop_name,
                              'title': title,
                              'price': f"{old_price_str} ➔ {price}",
                              'stock': stock_label,
                              'url': product_url,
                              'color': 3447003
                          })
                      else:
                          notifications.append({
                              'type': '📈 ZDRAŽENO',
                              'shop': shop_name,
                              'title': title,
                              'price': f"{old_price_str} ➔ {price}",
                              'stock': stock_label,
                              'url': product_url,
                              'color': 15158332
                          })

                  known_products[item_id] = {'in_stock': in_stock, 'price': price}

          notifications = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(user_agent=headers['User-Agent'], locale='cs-CZ')
              page = context.new_page()

              for shop_name, url, use_browser in urls_to_check:
                  html = ""
                  try:
                      if use_browser:
                          page.goto(url, wait_until='domcontentloaded', timeout=30000)
                          page.wait_for_timeout(5000)
                          html = page.content()
                      else:
                          resp = requests.get(url, headers=headers, timeout=15)
                          if resp.status_code == 200:
                              html = resp.text
                          else:
                              print(f'[{shop_name}] HTTP chyba {resp.status_code}')
                              continue
                  except Exception as e:
                      print(f'[{shop_name}] Chyba načítání: {e}')
                      continue

                  soup = BeautifulSoup(html, 'html.parser')
                  seen_in_shop = set()
                  found_count = 0

                  if shop_name in ['Pompo', 'Najada']:
                      for a in soup.find_all('a', href=True):
                          cand = a.get('title') or a.get_text(" ", strip=True)
                          cand_clean = clean_title_text(cand)
                          if not is_pokemon_item(cand_clean) or not (12 < len(cand_clean) < 140):
                              continue

                          parent = a.parent
                          card_text = ""
                          price = None
                          for _ in range(4):
                              if not parent:
                                  break
                              txt = parent.get_text(" ", strip=True)
                              if len(txt) < 600:
                                  p_found = extract_price(txt)
                                  if p_found:
                                      price = p_found
                                      card_text = txt
                                      break
                              parent = parent.parent

                          if not price or cand_clean in seen_in_shop:
                              continue
                          seen_in_shop.add(cand_clean)
                          found_count += 1

                          product_url = urljoin(url, a['href'])
                          in_stock, stock_label = detect_stock(card_text)
                          evaluate_item(shop_name, cand_clean, price, in_stock, stock_label, product_url)
                  else:
                      cards = soup.find_all(['div', 'article', 'li', 'tr'], class_=lambda x: x and any(
                          k in x.lower() for k in ['product', 'item', 'box', 'card', 'browsingitem', 'p-in', 'goods', 'zbozi', 'grid']
                      ))

                      for card in cards:
                          if len(card.find_all(['div', 'article', 'li'])) > 35:
                              continue

                          card_text = card.get_text(" ", strip=True)
                          price = extract_price(card_text)
                          if not price:
                              continue

                          title = ""
                          title_el = None
                          for el in card.find_all(['h2', 'h3', 'h4', 'a', 'span', 'p']):
                              cand = el.get('title') if el.get('title') and len(el.get('title')) > 8 else el.get_text(" ", strip=True)
                              if not cand:
                                  continue
                              cand_clean = clean_title_text(cand)
                              
                              if is_pokemon_item(cand_clean) and 12 < len(cand_clean) < 140:
                                  title = cand_clean
                                  title_el = el
                                  break

                          if not title or title in seen_in_shop:
                              continue
                          seen_in_shop.add(title)
                          found_count += 1

                          link_el = title_el if (title_el and title_el.name == 'a' and title_el.get('href')) else card.find('a', href=True)
                          product_url = urljoin(url, link_el['href']) if link_el else url

                          in_stock, stock_label = detect_stock(card_text)
                          evaluate_item(shop_name, title, price, in_stock, stock_label, product_url)

                  print(f"[{shop_name}] Nalezeno produktů: {found_count}")

              browser.close()

          with open(cache_file, 'w', encoding='utf-8') as f:
              json.dump(known_products, f, ensure_ascii=False, indent=2)

          if notifications and webhook_url:
              print(f"Odesílám {min(len(notifications), 10)} nových zpráv na Discord...")
              for item in notifications[:10]:
                  embed = {
                      "title": f"{item['type']} | {item['shop']}",
                      "description": f"**[{item['title']}]({item['url']})**",
                      "color": item['color'],
                      "fields": [
                          {"name": "💰 Cena", "value": item['price'], "inline": True},
                          {"name": "📦 Dostupnost", "value": item['stock'], "inline": True}
                      ]
                  }
                  payload = {
                      "content": "@everyone",
                      "allowed_mentions": {"parse": ["everyone"]},
                      "embeds": [embed]
                  }
                  r = requests.post(webhook_url, json=payload)
                  if r.status_code not in (200, 204):
                      print(f"CHYBA DISCORDU ({r.status_code}): {r.text}")
          else:
              print("Žádné nové produkty, naskladnění ani změny cen.")
          EOF
          python tracker.py
          rm tracker.py

      - name: Commit cache updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update product cache'
          file_pattern: cache.json
          pull_options: --rebase
