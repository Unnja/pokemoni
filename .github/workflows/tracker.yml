name: Pokemon Tracker

on:
  workflow_dispatch:

concurrency:
  group: pokemon-tracker-group
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run tracking script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat << 'EOF' > tracker.py
          import os, re, json, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright

          webhook_url = os.environ.get('DISCORD_WEBHOOK', '').strip()

          urls_to_check = [
              ('Veselý drak', 'https://www.vesely-drak.cz/produkty/specialni-sety/', False),
              ('Veselý drak', 'https://www.vesely-drak.cz/produkty/pokemon-elite-trainer-box/', False),
              ('Planetaher', 'https://www.planetaher.cz/pokemon/?order=-date', False),
              ('Xzone', 'https://www.xzone.cz/sberatelske-hry-pokemon-tcg?sort=date_desc&s=60&page=1&term=&c=725', False),
              ('Smarty', 'https://www.smarty.cz/pokemon-tcg-4c14578', True),
              ('Modroocko', 'https://www.modroocko.cz/nedrevene-hracky/spolecenske-hry/pokemon-tcg/', False),
              ('Ceskatrafika', 'https://www.ceskatrafika.com/pokemon-sberatelske-karty/?order=bestseller', False),
              ('Najada', 'https://www.najada.games/pokemon', True),
              ('Cech', 'https://www.cechhracu.cz/kategorie/pokemon/', False),
              ('Blindbox', 'https://www.blindbox.cz/merchandise/karty/', False),
              ('Pompo', 'https://pompo.cz/pokemon-tcg/', True)
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept-Language': 'cs-CZ,cs;q=0.9'
          }

          cache_file = 'cache.json'
          known_products = {}
          if os.path.exists(cache_file):
              try:
                  with open(cache_file, 'r', encoding='utf-8') as f:
                      known_products = json.load(f)
              except:
                  known_products = {}

          def is_pokemon_item(title, require_pokemon_kw=True):
              t = title.lower().strip()
              min_len = 12 if require_pokemon_kw else 6
              if len(t) <= min_len or t in ['pokémon tcg', 'pokemon tcg', 'sealed products', 'produkty']:
                  return False
              if require_pokemon_kw and not any(k in t for k in ['pokemon', 'pokémon', 'poké ball', 'poke ball']):
                  return False
              bad_words = [
                  'doprava', 'košík', 'skladem', 'připravujeme', 'top 10', 'kategorie',
                  'filtrovat', 'seřadit', 'přihlášení', 'přihlásit se', 'flesh and blood', 'magic:',
                  'lorcana', 'one piece', 'star wars', 'poškozené obaly',
                  'pokémon up', 'pokemon up', 'album', 'portfolio', 'binder',
                  'krabička na karty', 'obaly na karty', 'herní podložka', 'manga',
                  'školní potřeby', 'battle academy', 'obchodní podmínky', 'kontakt',
                  'registrace', 'zapomenuté heslo', 'ochrana osobních údajů', 'aktivovat odměn'
              ]
              if any(bw in t for bw in bad_words):
                  return False
              return True

          def parse_price_num(price_str):
              if not price_str:
                  return None
              digits = re.sub(r'[^\d]', '', price_str)
              return int(digits) if digits else None

          known_products = {
              k: v for k, v in known_products.items()
              if (k.startswith('Alza_') or is_pokemon_item(k.split('_', 1)[-1], require_pokemon_kw=not k.startswith('Najada_')))
              and 'Poslední kus v prodejně' not in k
              and '€' not in v.get('price', '')
              and not (k.startswith('Cech_') and (parse_price_num(v.get('price', '')) or 0) < 100)
          }

          def clean_title_text(raw):
              txt = re.sub(r'^(?:Znáte z katalogu|Cenový hit[^\s]*|Novinka|Akce|-\d+%\s+|\d+\s+(?!Pocket\b))\s*', '', raw, flags=re.I).strip()
              txt = re.sub(r'\s*(?:Dostupné v jiných prodejnách|Poslední kus v prodejně|Nedostupné|Skladem|Není skladem|Vyprodáno).*$', '', txt, flags=re.I).strip()
              txt = re.sub(r'\d[\d\s\xa0]*(?:[.,]\d{1,2})?(?:,-|\s*Kč|\s*€).*$', '', txt).strip()
              return txt

          def detect_stock(text):
              t = text.lower()
              out_keywords = [
                  'vyprodáno', 'není skladem', 'nedostupné', 'na dotaz',
                  'momentálně nedostupné', 'hlídat dostupnost', 'sold out',
                  'připravujeme', 'nelze zakoupit', 'těšíme se',
                  'dostupné v jiných prodejnách', 'poslední kus v prodejně'
              ]
              in_keywords = ['skladem', 'ihned k odeslání', 'předobjednávka', 'koupit', 'do košíku', 'vložit do košíku', ' ks']
              
              for kw in out_keywords:
                  if kw in t:
                      if 'připravujeme' in t or 'těšíme se' in t:
                          return False, '⏳ Připravujeme'
                      if 'v jiných prodejnách' in t or 'poslední kus' in t:
                          return False, '🏪 Jen na prodejnách'
                      return False, '❌ Vyprodáno'
              for kw in in_keywords:
                  if kw in t:
                      if 'předobjednávka' in t:
                          return True, '⏳ Předobjednávka'
                      return True, '✅ Skladem'
              return True, 'ℹ️ Pravděpodobně skladem'

          def extract_price(text):
              matches = re.findall(r'(?<!\d)(\d{1,3}(?:[\s\xa0]\d{3})*|\d{1,5})(?:[.,]\d{1,2})?(?:\s*,-|\s*Kč|\s*€)', text)
              valid_prices = []
              for m in matches:
                  num = int(re.sub(r'\s+', '', m))
                  if 30 <= num <= 50000:
                      clean_str = f"{num:,}".replace(",", " ")
                      currency = "€" if "€" in text else "Kč"
                      valid_prices.append(f"{clean_str} {currency}")
              return valid_prices[-1] if valid_prices else None

          def evaluate_item(shop_name, title, price, in_stock, stock_label, product_url):
              item_id = f"{shop_name}_{title}"
              prev_data = known_products.get(item_id)

              if prev_data is None:
                  known_products[item_id] = {'in_stock': in_stock, 'price': price}
                  if in_stock:
                      notifications.append({
                          'type': '🆕 NOVINKA SKLADEM',
                          'shop': shop_name,
                          'title': title,
                          'price': price,
                          'stock': stock_label,
                          'url': product_url,
                          'color': 3066993
                      })
              else:
                  was_in_stock = prev_data.get('in_stock', False)
                  old_price_str = prev_data.get('price', '')
                  old_num = parse_price_num(old_price_str)
                  new_num = parse_price_num(price)

                  if not was_in_stock and in_stock:
                      price_info = f"{old_price_str} ➔ {price}" if (old_num and new_num and old_num != new_num) else price
                      notifications.append({
                          'type': '🔄 NASKLADNĚNO (RESTOCK)',
                          'shop': shop_name,
                          'title': title,
                          'price': price_info,
                          'stock': stock_label,
                          'url': product_url,
                          'color': 15844367
                      })
                  elif old_num and new_num and new_num != old_num:
                      if new_num < old_num:
                          notifications.append({
                              'type': '📉 ZLEVNĚNO',
                              'shop': shop_name,
                              'title': title,
                              'price': f"{old_price_str} ➔ {price}",
                              'stock': stock_label,
                              'url': product_url,
                              'color': 3447003
                          })
                      else:
                          notifications.append({
                              'type': '📈 ZDRAŽENO',
                              'shop': shop_name,
                              'title': title,
                              'price': f"{old_price_str} ➔ {price}",
                              'stock': stock_label,
                              'url': product_url,
                              'color': 15158332
                          })

                  known_products[item_id] = {'in_stock': in_stock, 'price': price}

          notifications = []

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=['--disable-blink-features=AutomationControlled']
              )
              context = browser.new_context(
                  user_agent=headers['User-Agent'],
                  locale='cs-CZ',
                  viewport={'width': 1366, 'height': 900}
              )
              page = context.new_page()

              # --- Hlídání Alza (d13617422) ---
              try:
                  resp_alza = page.goto('https://www.alza.cz/d13617422.htm', wait_until='domcontentloaded', timeout=30000)
                  page.wait_for_timeout(4000)
                  final_url = page.url
                  alza_html = page.content()
                  alza_soup = BeautifulSoup(alza_html, 'html.parser')
                  alza_title = alza_soup.title.string.strip() if (alza_soup.title and alza_soup.title.string) else ''
                  status_code = resp_alza.status if resp_alza else 0

                  if status_code == 403 or len(alza_html) < 5000 or any(b in alza_title.lower() for b in ['access denied', 'attention required', 'captcha', 'robot']):
                      print(f"[Alza] Blokováno ochranou proti botům (HTTP {status_code})")
                  elif '18879069' in final_url or 'pokemon-karty' in final_url:
                      print("[Alza] Produkt zatím skrytý (stále přesměrovává do kategorie).")
                  else:
                      alza_text = alza_soup.get_text(" ", strip=True)
                      alza_price = extract_price(alza_text) or "Cena na webu"
                      alza_in_stock = any(k in alza_text.lower() for k in ['do košíku', 'koupit', 'skladem']) and not any(
                          k in alza_text.lower() for k in ['nelze zakoupit', 'hlídat dostupnost', 'již neprodáváme', 'těšíme se']
                      )
                      alza_stock_label = '✅ Skladem' if alza_in_stock else '⏳ Karta aktivní (čeká na sklad)'

                      if not known_products.get('Alza_d13617422_unlocked'):
                          known_products['Alza_d13617422_unlocked'] = {'in_stock': True, 'price': alza_price}
                          notifications.append({
                              'type': '🚨 ALZA ODEMKLA KARTU PRODUKTU',
                              'shop': 'Alza',
                              'title': 'Pokémon TCG: 30th Celebration Ultra Premium Collection - Night',
                              'price': alza_price,
                              'stock': alza_stock_label,
                              'url': final_url,
                              'color': 15158332
                          })

                      evaluate_item(
                          'Alza',
                          'Pokémon TCG: 30th Celebration Ultra Premium Collection - Night',
                          alza_price,
                          alza_in_stock,
                          alza_stock_label,
                          final_url
                      )
                      print(f"[Alza] KARTA AKTIVNÍ! URL: {final_url} | Stav: {alza_stock_label}")
              except Exception as e:
                  print(f"[Alza] Chyba kontroly: {e}")

              for shop_name, url, use_browser in urls_to_check:
                  html = ""
                  try:
                      if use_browser:
                          page.goto(url, wait_until='domcontentloaded', timeout=30000)
                          page.wait_for_timeout(5000)
                          if shop_name == 'Najada' and '€' in page.content():
                              try:
                                  curr_btn = page.locator("header, nav").locator("button, a, [role='button'], div, span").filter(has_text=re.compile(r'^\s*(EUR|€)\s*$')).first
                                  if curr_btn.is_visible(timeout=2000):
                                      curr_btn.click()
                                      page.wait_for_timeout(1000)
                                      czk_opt = page.locator("button, a, li, div, span").filter(has_text=re.compile(r'^\s*(CZK|Kč)\s*$')).first
                                      if czk_opt.is_visible(timeout=2000):
                                          czk_opt.click()
                                          page.wait_for_timeout(3000)
                              except Exception:
                                  pass
                          page.evaluate("window.scrollTo(0, document.body.scrollHeight / 2)")
                          page.wait_for_timeout(2000)
                          html = page.content()
                      else:
                          resp = requests.get(url, headers=headers, timeout=15)
                          if resp.status_code == 200:
                              html = resp.text
                          else:
                              print(f'[{shop_name}] HTTP chyba {resp.status_code}')
                              continue
                  except Exception as e:
                      print(f'[{shop_name}] Chyba načítání: {e}')
                      continue

                  soup = BeautifulSoup(html, 'html.parser')
                  shop_items = {}
                  require_kw = (shop_name != 'Najada')
                  min_title_len = 12 if require_kw else 6

                  if shop_name in ['Pompo', 'Najada']:
                      for a in soup.find_all('a', href=True):
                          if a.find_parent(['header', 'nav', 'footer']):
                              continue

                          href = a['href']
                          if href.startswith('#') or 'javascript:' in href:
                              continue

                          cand = a.get('title') or a.get_text(" ", strip=True)
                          cand_clean = clean_title_text(cand)
                          if not is_pokemon_item(cand_clean, require_pokemon_kw=require_kw) or not (min_title_len < len(cand_clean) < 140):
                              continue

                          parent = a.parent
                          card_text = ""
                          price = None
                          for _ in range(6):
                              if not parent:
                                  break
                              txt = parent.get_text(" ", strip=True)
                              if len(txt) < 800:
                                  p_found = extract_price(txt)
                                  if p_found:
                                      price = p_found
                                      card_text = txt
                                      break
                              parent = parent.parent

                          if not price:
                              continue

                          product_url = urljoin(url, href)
                          in_stock, stock_label = detect_stock(card_text)

                          if cand_clean not in shop_items or (not shop_items[cand_clean]['in_stock'] and in_stock):
                              shop_items[cand_clean] = {
                                  'price': price,
                                  'in_stock': in_stock,
                                  'stock_label': stock_label,
                                  'url': product_url
                              }
                  else:
                      cards = soup.find_all(['div', 'article', 'li', 'tr'], class_=lambda x: x and any(
                          k in x.lower() for k in ['product', 'item', 'box', 'card', 'browsingitem', 'p-in', 'goods', 'zbozi', 'grid']
                      ))

                      for card in cards:
                          if len(card.find_all(['div', 'article', 'li'])) > 35:
                              continue

                          card_text = card.get_text(" ", strip=True)
                          price = extract_price(card_text)
                          if not price:
                              continue

                          title = ""
                          title_el = None
                          for el in card.find_all(['h2', 'h3', 'h4', 'a', 'span', 'p']):
                              cand = el.get('title') if el.get('title') and len(el.get('title')) > 8 else el.get_text(" ", strip=True)
                              if not cand:
                                  continue
                              cand_clean = clean_title_text(cand)
                              
                              if is_pokemon_item(cand_clean, require_pokemon_kw=True) and 12 < len(cand_clean) < 140:
                                  title = cand_clean
                                  title_el = el
                                  break

                          if not title:
                              continue

                          link_el = title_el if (title_el and title_el.name == 'a' and title_el.get('href')) else card.find('a', href=True)
                          product_url = urljoin(url, link_el['href']) if link_el else url
                          in_stock, stock_label = detect_stock(card_text)

                          if title not in shop_items or (not shop_items[title]['in_stock'] and in_stock):
                              shop_items[title] = {
                                  'price': price,
                                  'in_stock': in_stock,
                                  'stock_label': stock_label,
                                  'url': product_url
                              }

                  for title, data in shop_items.items():
                      evaluate_item(shop_name, title, data['price'], data['in_stock'], data['stock_label'], data['url'])

                  print(f"[{shop_name}] Nalezeno produktů: {len(shop_items)}")

              browser.close()

          with open(cache_file, 'w', encoding='utf-8') as f:
              json.dump(known_products, f, ensure_ascii=False, indent=2)

          if notifications and webhook_url:
              print(f"Odesílám {min(len(notifications), 10)} nových zpráv na Discord...")
              for item in notifications[:10]:
                  embed = {
                      "title": f"{item['type']} | {item['shop']}",
                      "description": f"**[{item['title']}]({item['url']})**",
                      "color": item['color'],
                      "fields": [
                          {"name": "💰 Cena", "value": item['price'], "inline": True},
                          {"name": "📦 Dostupnost", "value": item['stock'], "inline": True}
                      ]
                  }
                  payload = {
                      "content": "@everyone",
                      "allowed_mentions": {"parse": ["everyone"]},
                      "embeds": [embed]
                  }
                  r = requests.post(webhook_url, json=payload)
                  if r.status_code not in (200, 204):
                      print(f"CHYBA DISCORDU ({r.status_code}): {r.text}")
          else:
              print("Žádné nové produkty, naskladnění ani změny cen.")
          EOF
          python tracker.py
          rm tracker.py

      - name: Commit cache updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update product cache'
          file_pattern: cache.json
          pull_options: --rebase
